<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL Redirector</title>
    <meta name="description" content="Turn any destination into a clean HTTPS redirect link.">
    <meta property="og:title" content="URL Redirector">
    <meta property="og:description" content="Make any URL clickable anywhere.">
    <meta property="og:image" content="https://exemplar-codes.github.io/anyscheme-link-redirector/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="generator" aria-labelledby="page-title">
        <div class="eyebrow"><span aria-hidden="true"></span> URL redirector</div>
        <h1 id="page-title">Paste a URL.</h1>
        <p class="intro"><kbd>Enter</kbd> copies the redirect link. <kbd>Esc</kbd> clears.</p>

        <form id="generator-form">
          <label for="destination">URL of any scheme</label>
          <div class="input-row">
            <input id="destination" placeholder="codex://workspace/item?id=123" autocomplete="off" spellcheck="false" autofocus required>
          </div>
        </form>

        <div id="result" class="result" hidden aria-live="polite">
          <span>Copied to clipboard</span>
          <output id="redirect-url"></output>
        </div>
      </section>
    </main>
  </body>
</html>
