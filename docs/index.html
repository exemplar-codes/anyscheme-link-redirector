<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL Redirector</title>
    <meta name="description" content="Turn any destination into a clean HTTPS redirect link.">
    <meta property="og:title" content="URL Redirector">
    <meta property="og:description" content="Make any URL clickable anywhere.">
    <meta property="og:image" content="https://exemplar-codes.github.io/anyscheme-link-redirector/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="generator" aria-labelledby="page-title">
        <div class="eyebrow"><span aria-hidden="true"></span> URL redirector</div>
        <h1 id="page-title">Make any URL<br>clickable anywhere.</h1>
        <p class="intro">Wrap any destination—even a custom app link—in a clean HTTPS URL. Nothing is stored.</p>

        <form id="generator-form">
          <label for="destination">Destination URL</label>
          <div class="input-row">
            <input id="destination" placeholder="codex://workspace/item?id=123" autocomplete="off" spellcheck="false" autofocus>
            <button type="submit">Generate link</button>
          </div>
        </form>

        <div id="result" class="result" hidden aria-live="polite">
          <div>
            <span>Your HTTPS link</span>
            <output id="redirect-url"></output>
          </div>
          <button type="button" id="copy" class="copy">Copy</button>
        </div>

        <p class="privacy"><span aria-hidden="true">◆</span> Generated entirely in your browser</p>
      </section>
    </main>
  </body>
</html>
